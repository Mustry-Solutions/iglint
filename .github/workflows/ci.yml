name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every test binary runs, so that one failure does not hide others.
      - run: cargo test --workspace --locked --no-fail-fast
      - name: clippy (platform-specific code)
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  oracle-replay:
    name: oracle replay
    # Compares the parsers with outputs recorded from Ignition's own parsers
    # (oracle/). Replaying needs no Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --locked
          -p iglint_python --test oracle --test float_repr
          -p iglint_python_semantic --test compile_oracle
          -p iglint_expression --test oracle

  stress:
    name: stress (${{ matrix.os }})
    # Generated inputs at and beyond the depth limits, through the release
    # binary, the ign-lint mode and the language server.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p iglint --test stress

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the rust-version of Cargo.toml
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo "+$MSRV" check --workspace --all-targets --locked

  docs:
    name: rule docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p iglint -- generate-docs --check

  no-leak:
    name: no private corpus data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: scripts/check-no-leak.sh
        shell: bash
        env:
          # One marker per line; kept out of the repository on purpose.
          LEAK_MARKERS: ${{ secrets.IGLINT_LEAK_MARKERS }}
        run: |
          if [[ -n "$LEAK_MARKERS" ]]; then
            printf '%s\n' "$LEAK_MARKERS" > "$RUNNER_TEMP/leak-markers.txt"
            export IGLINT_LEAK_MARKERS="$RUNNER_TEMP/leak-markers.txt"
          fi
          scripts/check-no-leak.sh

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      # `npm test` passes a glob to `node --test`, which Node.js expands
      # from version 21.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p iglint
      - run: xvfb-run -a npm run test:integration

  python-package:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv tool run maturin build --release --out dist
      - name: Install the wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/venv/bin/iglint" --version
