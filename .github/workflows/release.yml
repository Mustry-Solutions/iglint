name: Release

# Builds everything on a version tag (v0.1.0) and attaches the archives,
# their checksums and the VS Code extension to a draft GitHub release, which
# is published by hand after checking. The VS Code
# Marketplace is not published from here.
#
# Publishing to PyPI is off until it is configured. To enable it, create a
# pending trusted publisher on PyPI for the project `iglint` (owner
# Mustry-Solutions, repository iglint, workflow release.yml, environment
# pypi), then set the repository variable PYPI_PUBLISH to `true`. Later tags
# then publish to PyPI; for a tag that is already released, re-run its
# release workflow (the github-release job leaves the existing release as it
# is, and the wheels are built again).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is VS Code's platform name, also used for artifacts.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    env:
      # Windows: no dependency on the Visual C++ runtime.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p iglint --target ${{ matrix.target }}
      - name: Check the binary
        if: "!(matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin')"
        shell: bash
        run: target/${{ matrix.target }}/release/iglint --version
      - uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/iglint${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  # One archive per operating system (Linux has two, x86_64 and ARM), and
  # one checksum file for all of them. The names carry no version, so
  # `releases/latest/download/iglint-linux-x64.tar.gz` always works.
  archives:
    name: archives
    needs: binaries
    # For `lipo`, which joins the two macOS binaries into one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: bin-*
          path: bin
      - name: Package
        run: |
          mkdir dist
          lipo -create -output bin/iglint-macos bin/bin-darwin-x64/iglint bin/bin-darwin-arm64/iglint
          lipo -info bin/iglint-macos
          package() { # name, binary, format
            mkdir "dist/$1"
            cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "dist/$1/"
            if [ "$3" = zip ]; then
              cp "$2" "dist/$1/iglint.exe"
              (cd dist && zip -qr "$1.zip" "$1")
            else
              cp "$2" "dist/$1/iglint"
              chmod +x "dist/$1/iglint"
              tar -C dist -czf "dist/$1.tar.gz" "$1"
            fi
            rm -r "dist/$1"
          }
          package iglint-linux-x64 bin/bin-linux-x64/iglint tar
          package iglint-linux-arm64 bin/bin-linux-arm64/iglint tar
          package iglint-macos bin/iglint-macos tar
          package iglint-windows-x64 bin/bin-win32-x64/iglint.exe zip
          (cd dist && shasum -a 256 iglint-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: archives
          path: dist/*

  wheels:
    name: wheel (${{ matrix.target }} ${{ matrix.manylinux }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          # Built on an ARM runner: the manylinux2014 cross-compiling image's
          # GCC is too old for mimalloc (`-Werror=date-time`).
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64-apple-darwin, manylinux: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Commit for `iglint --version`
        shell: bash
        run: |
          echo "IGLINT_COMMIT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IGLINT_COMMIT_DATE=$(git log -1 --format=%cs HEAD)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  vscode:
    name: VS Code extension
    needs: binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: bin-*
          path: bin
      # One VSIX for every platform: bundled/<platform>/ holds each binary,
      # and the extension picks the one for the machine it runs on.
      - name: Package one VSIX with the binary for every platform
        run: |
          {
            echo "iglint is licensed under either of the MIT License or the Apache License 2.0, at your option."
            echo
            cat ../../LICENSE-MIT
            echo
            cat ../../LICENSE-APACHE
          } > LICENSE
          for dir in ../../bin/bin-*; do
            platform="${dir##*/bin-}"
            mkdir -p "bundled/$platform"
            cp "$dir"/* "bundled/$platform/"
            chmod +x "bundled/$platform"/*
          done
          mkdir -p ../../dist
          npx --yes @vscode/vsce@3 package -o ../../dist/iglint-vscode.vsix
      - uses: actions/upload-artifact@v6
        with:
          name: vscode
          path: dist/iglint-vscode.vsix

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [archives, wheels, sdist, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: "{archives,vscode}"
          path: dist
          merge-multiple: true
      # The wheels go to PyPI only, not to the release.
      - name: Create a draft release with the archives and the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run (for example to publish to PyPI later) leaves an
          # existing release as it is.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME exists already; not changed."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "iglint ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."

  pypi:
    name: publish to PyPI
    # Skipped (not failed) until PyPI is configured; see the top of this file.
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH == 'true'
    needs: [wheels, sdist, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
