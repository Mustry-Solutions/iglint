[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "iglint"
description = "A fast linter for Ignition 8.3 projects: Perspective views, Jython scripts, expressions and gateway resources."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Mustry Solutions" }]
keywords = ["ignition", "perspective", "jython", "scada", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 2.7",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Mustry-Solutions/iglint"
Documentation = "https://iglint.mustrysolutions.com/"
Changelog = "https://github.com/Mustry-Solutions/iglint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mustry-Solutions/iglint/issues"

[tool.maturin]
# Ships the `iglint` binary only (no Python module): `pip install iglint`
# puts `iglint` on PATH.
bindings = "bin"
manifest-path = "crates/iglint/Cargo.toml"
module-name = "iglint"
strip = true
include = [{ path = "LICENSE-*", format = "sdist" }, { path = "NOTICE", format = "sdist" }]
