[package]
name = "iglint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A fast linter for Ignition 8.3 projects"
readme = "../../README.md"
keywords = ["ignition", "perspective", "jython", "linter", "scada"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "iglint"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
iglint_config.workspace = true
iglint_json.workspace = true
iglint_linter.workspace = true
iglint_server.workspace = true
iglint_text.workspace = true
anyhow.workspace = true
rayon.workspace = true
clap.workspace = true
glob.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
similar.workspace = true
toml.workspace = true

[dev-dependencies]
iglint_linter = { workspace = true, features = ["testing"] }
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
tempfile.workspace = true
