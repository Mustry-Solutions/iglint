# pre-commit hooks. `language: python` installs this repository with pip,
# which builds the `iglint` binary with maturin (needs a Rust toolchain on
# first use). See README.md for a hook that uses the PyPI wheel instead.
- id: iglint
  name: iglint
  description: Lint Ignition 8.3 projects (views, scripts, expressions, resources) with iglint.
  entry: iglint check
  language: python
  types_or: [json, python]
  require_serial: true
  minimum_pre_commit_version: "2.9.2"

- id: iglint-fix
  name: iglint (fix)
  description: Apply iglint's safe fixes, then report what is left.
  entry: iglint check --fix
  language: python
  types_or: [json, python]
  require_serial: true
  minimum_pre_commit_version: "2.9.2"

# Drop-in replacement for ign-lint's own hook (same id, `files`, `types`,
# default `args` and file passing): repositories that use ign-lint's hook
# switch by changing only `repo` and `rev`. Runs iglint's ign-lint
# compatible mode, so the configuration, output and exit status are
# ign-lint's (docs/compat/ign-lint.md). As with ign-lint 0.6.4, the
# default `--config=.ignition-lint-precommit.json` must exist in the
# repository, or `args` must name another configuration.
- id: ign-lint
  name: Ignition Lint (iglint)
  description: ign-lint compatible linting of Perspective views with iglint (iglint ign-lint).
  entry: iglint ign-lint
  language: python
  types: [json]
  files: view\.json$
  args: ['--config=.ignition-lint-precommit.json']
  pass_filenames: true
  minimum_pre_commit_version: "2.9.2"
