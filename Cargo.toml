[workspace]
resolver = "3"
members = ["crates/*", "bench/gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mustry-Solutions/iglint"
rust-version = "1.90"

[workspace.dependencies]
iglint_text = { path = "crates/iglint_text" }
iglint_json = { path = "crates/iglint_json" }
iglint_python = { path = "crates/iglint_python" }
iglint_python_semantic = { path = "crates/iglint_python_semantic" }
iglint_expression = { path = "crates/iglint_expression" }
iglint_project = { path = "crates/iglint_project" }
iglint_stubs = { path = "crates/iglint_stubs" }
iglint_linter = { path = "crates/iglint_linter" }
iglint_config = { path = "crates/iglint_config" }
iglint_server = { path = "crates/iglint_server" }

anyhow = "1.0.100"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
glob = "0.3.3"
ignore = "0.4.25"
rayon = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
regex = "1.11"
similar = "2.7"
toml = { version = "1", features = ["preserve_order"] }

# dev
assert_cmd = "2.1"
insta = "1.43"
predicates = "3.1"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
